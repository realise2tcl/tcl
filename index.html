<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCL規格查詢</title>
    <meta property="og:title" content="TCL規格查詢">
    <meta property="og:type" content="website">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; margin: 0; padding: 0; box-sizing: border-box; }
        header { background: linear-gradient(to right, #4338ca, #6d28d9); padding: 20px 16px; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .search-container { max-width: 600px; margin: 0 auto; width: 100%; }
        #searchInput { width: 100%; padding: 14px 18px; font-size: 24px !important; font-weight: 800 !important; color: #0f172a; border: none; border-radius: 12px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.06); box-sizing: border-box; }
        #matchCount { text-align: center; font-size: 15px; font-weight: bold; color: #ddd6fe; margin-top: 12px; margin-bottom: 4px; }
        main { padding: 20px 12px; max-width: 600px; margin: 0 auto; box-sizing: border-box; }
        .spinner { display: inline-block; width: 36px; height: 36px; border: 4px solid #4338ca; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading { text-align: center; padding: 80px 0; color: #94a3b8; }
        #noResult { text-align: center; padding: 80px 0; color: #94a3b8; font-weight: bold; font-size: 16px; }
        .card-box { background-color: #ffffff; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -4px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 48px !important; overflow: hidden; display: flex; flex-direction: column; }
        .wrap { word-break: break-all; white-space: pre-wrap; }
        .grid-table { width: 100%; table-layout: fixed; border-collapse: collapse !important; border: 1px solid #94a3b8 !important; }
        .grid-table tr { border-bottom: 1px solid #cbd5e1 !important; }
        .grid-table td { border: 1px solid #cbd5e1 !important; padding: 16px 12px !important; font-size: 14px; vertical-align: top; box-sizing: border-box; }
        .title-td { width: 100px; text-align: right; font-weight: bold; color: #64748b; background-color: #f8fafc; user-select: none; border-right: 1px solid #cbd5e1 !important; }
        .hi-tr { background-color: #fef3c7 !important; }
        .hi-title-td { color: #92400e !important; font-weight: bold; background-color: #fef3c7 !important; }
    </style>
</head>
<body>
    <header>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="搜尋機型、主板、機蕊...">
        </div>
        <div id="matchCount" style="display: none;"></div>
    </header>
    <main>
        <div id="loading"><div class="spinner"></div></div>
        <div id="cardContainer" style="display: none;"></div>
        <div id="noResult" style="display: none;"><p style="font-size: 48px; margin: 0 0 12px 0;">🔍</p>查無此機型或相關料號</div>
    </main>
    <script>
        // ==========================================================
        // 💡 已經為您切換為「規格」工作表名稱
        const SPREADSHEET_ID = '把這裡換成您的Google試算表ID'; 
        const SHEET_NAME = '規格'; 
        // ==========================================================
        const API_URL = `https://google.com{SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
        let allRawRows = [];
        const searchKeys = ['機型', '主板料號', '機蕊型號', '電源板編號'];
        
        const sortedLabels = [
            '適用電壓', '重量', '外觀尺寸', '國際條碼', '射頻編號', '功耗', '基座', 
            '分位', 'PID碼', '主板料號', '機蕊型號', '電源板編號', '驅動板A', '驅動板B', 
            '遙控器', '腳座螺絲', '壁掛螺絲', '腳座A', '腳座B', '腳座C', '腳座D', 
            '背光驅動', '面板', '語音板', 'HDMI1', 'HDMI2', 'HDMI3', 'HDMI4', '面板玻璃'
        ];

        window.addEventListener('load', () => {
            document.getElementById('noResult').style.display = 'none';
            document.getElementById('cardContainer').style.display = 'none';

            fetch(API_URL)
                .then(res => res.text())
                .then(text => {
                    const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                    const data = JSON.parse(jsonString);
                    const rows = data.table.rows;
                    
                    allRawRows = rows.map(row => {
                        return row.c.map(cell => cell ? String(cell.v).trim() : '');
                    });
                    
                    if(allRawRows.length > 0) allRawRows.shift(); // 排除標題列
                    document.getElementById('loading').style.display = 'none';
                })
                .catch(err => {
                    document.getElementById('loading').innerHTML = '<span style="color:#ef4444; font-weight:bold;">資料同步失敗、請檢查試算表共用權限與分頁名稱</span>';
                });
        });

        function getDisplayValue(val) {
            if (val === undefined || val === null || String(val).trim() === '') {
                return '<span style="color: #cbd5e1; font-size: 12px; font-style: italic; font-weight: normal;">未錄入</span>';
            }
            return `<span style="color: #1e293b; font-weight: 600;" class="wrap">${val}</span>`;
        }

        function renderCards(filteredRows) {
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';
            
            if (filteredRows.length === 0) {
                document.getElementById('noResult').style.display = 'block';
                container.style.display = 'none';
                return;
            }
            document.getElementById('noResult').style.display = 'none';
            container.style.display = 'block';

            filteredRows.forEach(rowArr => {
                const card = document.createElement('div');
                card.className = "card-box";
                const currentModel = rowArr || '未填寫';
                
                let html = `<table class="grid-table" style="background: linear-gradient(to right, #1e293b, #0f172a); border: none !important;"><tr style="border: none !important;"><td class="title-td" style="width: 100px; text-align: center; color: #ffffff; background: transparent; border: none !important; padding: 16px 12px !important;"><span style="padding: 4px 6px; background-color: #6366f1; border-radius: 5px; font-size: 15px; display: block; font-weight: bold;">機型</span></td><td style="color: #ffffff; font-weight: bold; font-size: 20px; text-align: left; padding: 16px 12px !important; border: none !important;"><div class="wrap">${currentModel}</div></td></tr></table>`;
                html += `<table class="grid-table"><tbody>`;
                
                sortedLabels.forEach((labelName, index) => {
                    const cellValue = rowArr[index + 1] || '';
                    const isHi = searchKeys.includes(labelName); 
                    const rCls = isHi ? 'class="hi-tr"' : '';
                    const tCls = isHi ? 'hi-title-td' : 'title-td';
                    html += `<tr ${rCls}><td class="${tCls}">${labelName}</td><td style="text-align: left;"><div class="wrap">${getDisplayValue(cellValue)}</div></td></tr>`;
                });
                
                html += `</tbody></table>`;
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const kw = e.target.value.toLowerCase().trim();
            const container = document.getElementById('cardContainer');
            const countEl = document.getElementById('matchCount');
            const noResultEl = document.getElementById('noResult');
            
            if (!kw) { 
                container.innerHTML = ''; 
                container.style.display = 'none';
                noResultEl.style.display = 'none';
                countEl.style.display = 'none';
                return; 
            }
            
            const filtered = allRawRows.filter(rowArr => {
                return rowArr.some(cellVal => String(cellVal || '').toLowerCase().includes(kw));
            });
            
            countEl.innerText = `💡 共符合 ${filtered.length} 筆資料`;
            countEl.style.display = 'block';
            renderCards(filtered);
        });
    </script>
</body>
</html>
